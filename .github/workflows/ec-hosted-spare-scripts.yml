name: EC native experiment script checks

on:
  push:
    branches: [feat/ec-spare-faults, feat/ec-local-file, fix/ec-mode4-preflight, fix/ec-local-native-acceptance, feat/ec-managed-start-deny, fix/ec-posix-error-evidence]
    paths:
      - .github/workflows/ec-hosted-spare-scripts.yml
      - scripts/ec/**
      - configs/**
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/README*'
      - '!**/docs/**'

permissions:
  contents: read

concurrency:
  group: ec-spare-scripts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scripts:
    if: github.repository == 'ena0828/3FS-EC' && (github.ref == 'refs/heads/feat/ec-spare-faults' || github.ref == 'refs/heads/feat/ec-local-file' || github.ref == 'refs/heads/fix/ec-mode4-preflight' || github.ref == 'refs/heads/fix/ec-local-native-acceptance' || github.ref == 'refs/heads/feat/ec-managed-start-deny' || github.ref == 'refs/heads/fix/ec-posix-error-evidence') && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact source revision
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Check configuration and owned supervisor controls without native services
        timeout-minutes: 5
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import subprocess
          import sys
          import unittest

          if sys.platform != "linux" or sys.version_info < (3, 11):
              raise SystemExit("These checks require Linux and Python 3.11+")
          source = Path.cwd().resolve()
          scripts = source / "scripts/ec/cluster"
          sys.path.insert(0, str(scripts))
          sys.path.insert(0, str(source / "scripts/ec/traces"))
          suites = {
              "cluster/test-native-v2-config.py": 24,
              "cluster/test-native-multiprocess-config.py": 7,
              "cluster/test-native-spare-storage.py": 8,
              "cluster/test-native-rdma-preflight.py": 11,
              "cluster/test-supervisor-command.py": 9,
              "cluster/test-native-managed-domain.py": 14,
              "cluster/test-portable-experiments.py": 9,
              "cluster/test-owned-lease.py": 9,
              "cluster/test-tree-gc-runner.py": 16,
              "cluster/test-tree-gc-acceptance.py": 4,
              "cluster/test-output-reservation-runner.py": 16,
              "cluster/test-kv-replay-native.py": 19,
              "cluster/test-kv-replay.py": 10,
              "traces/test_kv_trace.py": 18,
              "traces/test_replay_input.py": 5,
              "traces/test_replay_model.py": 8,
              "cluster/test-experiment-runner.py": 25,
              "cluster/test-experiment-menu.py": 13,
              "cluster/test-prepare-fuse-file.py": 8,
              "ci/test-run-file-lab.py": 41,
              "ci/test-run-core-tests.py": 16,
              "ci/test-run-spare-lab.py": 14,
              "ci/test-run-fault-matrix.py": 10,
              "ci/test-system-entrypoints.py": 18,
              "ci/test-rpc-frame-entrypoints.py": 13,
              "test-mode4-lifecycle-acceptance.py": 16,
              "test-mode4-mount-evidence.py": 9,
              "ci/test-build-native.py": 34,
              "ci/test-local-incremental-build.py": 9,
          }
          rows = []
          for filename, expected in suites.items():
              path = source / "scripts/ec" / filename
              spec = importlib.util.spec_from_file_location("ec_script_check_" + str(len(rows)), path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              suite = unittest.defaultTestLoader.loadTestsFromModule(module)
              if suite.countTestCases() != expected:
                  raise SystemExit(f"Unexpected test inventory in {filename}")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              rows.append({"file": filename, "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                           "run": result.testsRun, "expected": expected, "skipped": len(result.skipped),
                           "failures": len(result.failures), "errors": len(result.errors),
                           "passed": result.wasSuccessful() and not result.skipped and result.testsRun == expected})
          passed = all(row["passed"] for row in rows)
          print("SPARE_SCRIPT_CHECKS " + json.dumps({
              "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": sys.version, "checks": rows, "passed": passed,
              "native_services_started": False, "real_storage_faults": False,
              "scope": "Python configuration and supervisor checks; includes a private Unix control socket and owned Python child processes, no native Storage"}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY
