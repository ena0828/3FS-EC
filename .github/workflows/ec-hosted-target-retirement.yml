name: Native EC scope and target retirement acceptance

on:
  push:
    branches: [feat/ec-target-retirement]
    paths:
      - .github/workflows/ec-hosted-target-retirement.yml
      - scripts/ec/ci/run-codec-tests.py
      - scripts/ec/ci/test-run-codec-tests.py
      - src/storage/chunk_engine/**
      - src/storage/ec/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: ec-hosted-target-retirement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    if: github.repository == 'ena0828/3FS-EC' && github.ref == 'refs/heads/feat/ec-target-retirement' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the real Rust workspace
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Install tools and check the acceptance parser
        timeout-minutes: 15
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          sudo -n apt-get update -qq
          sudo -n apt-get install -y --no-install-recommends build-essential gcc-12 g++-12 libclang-18-dev cmake pkg-config python3 ca-certificates
          rustup toolchain install 1.99.1 --profile minimal
          python3 -B scripts/ec/ci/test-run-codec-tests.py -v

      - name: Build production Rust and verify scope and target retirement
        # Real RocksDB/WAL tests; this primitive is not yet a public RPC or an
        # external fencing certificate, and does not prove a whole-system drain.
        timeout-minutes: 100
        shell: bash
        run: |
          exec /usr/bin/python3 -B scripts/ec/ci/run-codec-tests.py --suite scope --work "$RUNNER_TEMP/ec-scope" --revision "$GITHUB_SHA"
