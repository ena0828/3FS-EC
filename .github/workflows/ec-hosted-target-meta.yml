name: EC target retirement Meta and integrated acceptance

on:
  push:
    branches: [feat/ec-target-meta, fix/ec-retirement-keys, fix/ec-meta-reflection, fix/ec-repair-recovery]
    paths:
      - .github/workflows/ec-hosted-target-meta.yml
      - scripts/ec/**
      - src/**
      - tests/**
      - cmake/**
      - configs/**
      - patches/**
      - third_party/**
      - benchmarks/**/CMakeLists.txt
      - CMakeLists.txt
      - Cargo.toml
      - Cargo.lock
      - .gitmodules
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/README*'
      - '!**/docs/**'

permissions:
  contents: read

concurrency:
  group: ec-hosted-target-meta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'ena0828/3FS-EC' && (github.ref == 'refs/heads/feat/ec-target-meta' || github.ref == 'refs/heads/fix/ec-retirement-keys' || github.ref == 'refs/heads/fix/ec-meta-reflection' || github.ref == 'refs/heads/fix/ec-repair-recovery') && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # Every native phase checks the shared remaining job budget. Any refused
    # phase fails the job; a partial pass is not integrated acceptance.
    # Neither an estimate nor a platform timeout proves completed cleanup.
    steps:
      - name: Check out this revision and pinned submodules
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: false
          persist-credentials: false

      - name: Record the running job time anchor
        timeout-minutes: 2
        shell: bash
        run: python3 -B scripts/ec/ci/system-job-budget.py record --profile target-meta

      - name: Check changed build and ownership entry points without native services
        timeout-minutes: 4
        shell: bash
        run: |
          python3 -B scripts/ec/ci/test-build-native.py -v
          python3 -B scripts/ec/ci/test-system-entrypoints.py -v
          python3 -B scripts/ec/ci/test-rpc-frame-entrypoints.py -v
          python3 -B scripts/ec/ci/test-run-core-tests.py -v
          python3 -B scripts/ec/ci/test-run-file-lab.py -v
          python3 -B scripts/ec/ci/test-run-spare-lab.py -v
          python3 -B scripts/ec/cluster/test-native-spare-storage.py -v
          python3 -B scripts/ec/cluster/test-portable-experiments.py -v
          python3 -B scripts/ec/cluster/test-experiment-runner.py -v
          python3 -B scripts/ec/cluster/test-experiment-menu.py -v

      - name: Build one ISA-L configuration for core regressions and both labs
        timeout-minutes: 240
        shell: bash
        run: bash scripts/ec/ci/build-native.sh --backend isal --build-jobs 4 --with-lab-targets --with-ec-regression-targets

      - name: Run native Storage service client and legacy regressions
        timeout-minutes: 35
        shell: bash
        run: |
          python3 -B scripts/ec/ci/system-job-budget.py check --profile target-meta --stage regression
          uid=$(id -u)
          gid=$(id -g)
          runner_user=$(id -un)
          runner_home=$HOME
          test "$uid" -ne 0
          sudo -n prlimit --memlock=3221225472:3221225472 --nofile=65536:65536 -- \
            setpriv --reuid="$uid" --regid="$gid" --init-groups \
            env HOME="$runner_home" USER="$runner_user" LOGNAME="$runner_user" \
            GITHUB_SHA="$GITHUB_SHA" LD_LIBRARY_PATH=/usr/local/lib /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/scripts/ec/ci/run-native-regressions.py" \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ec-native/build" \
            --work "$RUNNER_TEMP/ec-native/regressions" --backend isal --require-target-retirement

      - name: Run primary group authentication and service dispatch contracts
        timeout-minutes: 75
        shell: bash
        run: |
          python3 -B scripts/ec/ci/system-job-budget.py check --profile target-meta --stage service-contracts
          uid=$(id -u)
          gid=$(id -g)
          runner_user=$(id -un)
          runner_home=$HOME
          test "$uid" -ne 0
          sudo -n prlimit --memlock=3221225472:3221225472 --nofile=65536:65536 -- \
            setpriv --reuid="$uid" --regid="$gid" --init-groups \
            env HOME="$runner_home" USER="$runner_user" LOGNAME="$runner_user" \
            LD_LIBRARY_PATH=/usr/local/lib /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/scripts/ec/ci/run-core-tests.py" \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ec-native/build" \
            --fdb-bin-dir "$RUNNER_TEMP/ec-native/fdb/bin" \
            --work "$RUNNER_TEMP/ec-native/service-contracts" --profile service-contracts

      - name: Run nine Meta retirement catalogue RPC and release evidence cases
        timeout-minutes: 75
        shell: bash
        run: |
          python3 -B scripts/ec/ci/system-job-budget.py check --profile target-meta --stage target-meta
          uid=$(id -u)
          gid=$(id -g)
          runner_user=$(id -un)
          runner_home=$HOME
          test "$uid" -ne 0
          sudo -n prlimit --memlock=3221225472:3221225472 --nofile=65536:65536 -- \
            setpriv --reuid="$uid" --regid="$gid" --init-groups \
            env HOME="$runner_home" USER="$runner_user" LOGNAME="$runner_user" \
            LD_LIBRARY_PATH=/usr/local/lib /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/scripts/ec/ci/run-core-tests.py" \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ec-native/build" \
            --fdb-bin-dir "$RUNNER_TEMP/ec-native/fdb/bin" \
            --work "$RUNNER_TEMP/ec-native/target-meta-acceptance" --profile target-meta

      - name: Run private FDB native file cases and FUSE components
        timeout-minutes: 95
        shell: bash
        run: |
          python3 -B scripts/ec/ci/system-job-budget.py check --profile target-meta --stage core
          uid=$(id -u)
          gid=$(id -g)
          runner_user=$(id -un)
          runner_home=$HOME
          test "$uid" -ne 0
          sudo -n prlimit --memlock=3221225472:3221225472 --nofile=65536:65536 -- \
            setpriv --reuid="$uid" --regid="$gid" --init-groups \
            env HOME="$runner_home" USER="$runner_user" LOGNAME="$runner_user" \
            LD_LIBRARY_PATH=/usr/local/lib /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/scripts/ec/ci/run-core-tests.py" \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ec-native/build" \
            --fdb-bin-dir "$RUNNER_TEMP/ec-native/fdb/bin" \
            --work "$RUNNER_TEMP/ec-native/acceptance"
      - name: Run three-strategy native repair and per-call observation checks
        timeout-minutes: 75
        shell: bash
        run: |
          # The internal 70-minute deadline retains cleanup time within this
          # separate step. Check remaining job time before starting private FDB.
          python3 -B scripts/ec/ci/system-job-budget.py check --profile target-meta --stage repair
          uid=$(id -u)
          gid=$(id -g)
          runner_user=$(id -un)
          runner_home=$HOME
          test "$uid" -ne 0
          sudo -n prlimit --memlock=3221225472:3221225472 --nofile=65536:65536 -- \
            setpriv --reuid="$uid" --regid="$gid" --init-groups \
            env HOME="$runner_home" USER="$runner_user" LOGNAME="$runner_user" \
            LD_LIBRARY_PATH=/usr/local/lib /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/scripts/ec/ci/run-core-tests.py" \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ec-native/build" \
            --fdb-bin-dir "$RUNNER_TEMP/ec-native/fdb/bin" \
            --work "$RUNNER_TEMP/ec-native/repair-acceptance" --profile repair

      - name: Run file CLI and same-state POSIX and USRBIO remount
        timeout-minutes: 45
        shell: bash
        run: |
          python3 -B scripts/ec/ci/system-job-budget.py check --profile target-meta --stage file
          exec python3 -B scripts/ec/ci/run-file-lab.py \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ec-native/build" \
            --fdb-bin-dir "$RUNNER_TEMP/ec-native/fdb/bin" \
            --core-record "$RUNNER_TEMP/ec-native/acceptance/results.json"

      - name: Run central two-Storage faults with spare placement and original-instance recovery
        timeout-minutes: 35
        shell: bash
        run: |
          python3 -B scripts/ec/ci/system-job-budget.py check --profile target-meta --stage spare
          exec python3 -B scripts/ec/ci/run-spare-lab.py \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ec-native/build" \
            --fdb-bin-dir "$RUNNER_TEMP/ec-native/fdb/bin" \
            --core-record "$RUNNER_TEMP/ec-native/acceptance/results.json" \
            --strategy central --failures 2
