name: EC hosted native file acceptance

on:
  push:
    branches: [feat/ec-distributed]
    paths:
      - .github/workflows/ec-hosted-native.yml
      - scripts/ec/**
      - src/**
      - tests/**
      - cmake/**
      - configs/**
      - patches/**
      - third_party/**
      - benchmarks/**/CMakeLists.txt
      - CMakeLists.txt
      - Cargo.toml
      - Cargo.lock
      - .gitmodules
      - '!**/*.md'
      - '!**/*.rst'
      - '!**/README*'
      - '!**/docs/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: ec-hosted-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'ena0828/3FS-EC' && github.ref == 'refs/heads/feat/ec-distributed' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out this revision and pinned submodules
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: false
          persist-credentials: false

      - name: Record the API job start and admission timing
        timeout-minutes: 2
        shell: bash
        env:
          EC_JOB_BUDGET_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ec/ci/job-budget.py record

      - name: Check acceptance gates and Linux directory descriptors before building
        timeout-minutes: 3
        shell: bash
        run: |
          python3 -B scripts/ec/ci/test-run-core-tests.py -v
          python3 -B scripts/ec/ci/test-run-file-lab.py -v
          python3 -B scripts/ec/test-mode4-lifecycle-acceptance.py -v
          python3 -B scripts/ec/cluster/test-portable-experiments.py -v

      - name: Build core tests and the eight native file-lab programs
        timeout-minutes: 240
        shell: bash
        run: bash scripts/ec/ci/build-native.sh --build-jobs 4 --with-lab-targets

      - name: Run private FDB native cases and FUSE component tests
        # All steps share the 350-minute job cap; these are not additive budgets.
        timeout-minutes: 95
        shell: bash
        run: |
          uid=$(id -u)
          gid=$(id -g)
          runner_user=$(id -un)
          runner_home=$HOME
          test "$uid" -ne 0
          sudo -n prlimit --memlock=3221225472:3221225472 --nofile=65536:65536 -- \
            setpriv --reuid="$uid" --regid="$gid" --init-groups \
            env HOME="$runner_home" USER="$runner_user" LOGNAME="$runner_user" \
            LD_LIBRARY_PATH=/usr/local/lib /usr/bin/python3 -B \
            "$GITHUB_WORKSPACE/scripts/ec/ci/run-core-tests.py" \
            --source "$GITHUB_WORKSPACE" \
            --build "$RUNNER_TEMP/ec-native/build" \
            --fdb-bin-dir "$RUNNER_TEMP/ec-native/fdb/bin" \
            --work "$RUNNER_TEMP/ec-native/acceptance"

      - name: Run file CLI and same-state FUSE remount acceptance
        # Admission needs at least 50 estimated minutes left. This 45-minute cap is
        # an infrastructure limit, never evidence of orderly business cleanup.
        timeout-minutes: 45
        shell: bash
        run: |
          python3 -B scripts/ec/ci/job-budget.py check
          exec python3 -B scripts/ec/ci/run-file-lab.py \
            --source "$GITHUB_WORKSPACE" \
            --build "$RUNNER_TEMP/ec-native/build" \
            --fdb-bin-dir "$RUNNER_TEMP/ec-native/fdb/bin" \
            --core-record "$RUNNER_TEMP/ec-native/acceptance/results.json"
