name: Native Rust EC bridge cache acceptance

on:
  push:
    branches: [feat/ec-native-codec-cache]
    paths:
      - .github/workflows/ec-hosted-codec.yml
      - scripts/ec/ci/run-codec-tests.py
      - src/storage/chunk_engine/**
      - src/storage/ec/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: ec-hosted-codec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codec:
    if: github.repository == 'ena0828/3FS-EC' && github.ref == 'refs/heads/feat/ec-native-codec-cache' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the real Rust workspace
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Install compiler tools for the locked Rust dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          sudo -n apt-get update -qq
          sudo -n apt-get install -y --no-install-recommends build-essential gcc-12 g++-12 libclang-18-dev cmake pkg-config python3 ca-certificates
          rustup toolchain install 1.99.1 --profile minimal
          python3 --version

      - name: Build the production crate and run all nine EC bridge tests
        # This checks the actual Rust crate and CXX declarations, not the final
        # C++ executables, services, FUSE lifecycle or performance.
        timeout-minutes: 100
        shell: bash
        run: |
          exec /usr/bin/python3 -B scripts/ec/ci/run-codec-tests.py --work "$RUNNER_TEMP/ec-codec" --revision "$GITHUB_SHA"
